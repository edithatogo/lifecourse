[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifecourse"
version = "0.1.2"
authors = [
  { name="Dylan Mordaunt", email="dylan.mordaunt@example.com" }, # Placeholder email
]
description = "A microsimulation model for evaluating cost-effectiveness and budget impact of health interventions."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
keywords = ["microsimulation", "health economics", "cost-effectiveness", "QALY", "budget impact", "Dask"]

dependencies = [
    "numpy",
    "pandas",
    "dask",
    "matplotlib",
    "pyyaml",
    "scipy",
    "seaborn",
    "openpyxl", # For Excel output if used
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
lifecourse-cli = "lifecourse.cli:main"
lifecourse-main = "lifecourse.main:main"

[project.urls]
"Homepage" = "https://github.com/edithatogo/lifecourse"
"Bug Tracker" = "https://github.com/edithatogo/lifecourse/issues"
