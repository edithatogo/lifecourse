[tox]
envlist = py310,py311,py312,lint
skip_missing_interpreters = true

[testenv]
description = Run unit tests with pytest
deps = 
    -r{toxinidir}/requirements.txt
    pytest
commands = 
    pytest {posargs}

[testenv:lint]
description = Check code formatting and linting with ruff
basepython = python3.12
deps = 
    ruff
    pre-commit
skip_install = true
commands = 
    ruff format --check .
    ruff check .

[testenv:format]
description = Auto-format code with ruff
basepython = python3.12
deps = 
    ruff
skip_install = true
commands = 
    ruff format .
    ruff check --fix .

[testenv:coverage]
description = Run tests with coverage report
basepython = python3.12
deps = 
    -r{toxinidir}/requirements.txt
    pytest
    pytest-cov
commands = 
    pytest --cov=src/lifecourse --cov-report=term-missing --cov-report=html {posargs}
