[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifecourseid"
version = "0.1.0"
description = "LifeCourseID microsimulation model"
authors = [{name="Unknown"}]
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["src", "src.analysis", "src.model"]
