[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "LifeCourseID"
version = "0.1.0"
description = "Microsimulation model for cost-effectiveness and budget impact of interventions"
readme = "README.md"
authors = [{ name = "Contributors" }]
license = { file = "LICENSE" }
dependencies = [
    "dask[distributed]",
    "pandas",
    "matplotlib",
    "seaborn",
    "numpy",
    "scipy",
    "pyyaml",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["."]
