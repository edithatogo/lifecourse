name: Python CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Sync environment
      run: uv sync --all-extras --dev
    - name: Check formatting with ruff
      run: uv run ruff format --check src config tests/test_config_validation.py tests/test_data_validation.py tests/test_packaging_smoke.py
    - name: Lint with ruff
      run: uv run ruff check src config tests/test_config_validation.py tests/test_data_validation.py tests/test_packaging_smoke.py
    - name: Type check with basedpyright
      run: uv run basedpyright

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Sync environment
      run: uv sync --all-extras --dev

    - name: Build distribution
      run: uv build

    - name: Test with pytest
      run: uv run pytest
