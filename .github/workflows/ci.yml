name: Python CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 16 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose-lint:
    name: Vale Prose Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"

    - name: Install Vale
      run: |
        go install github.com/errata-ai/vale/v2@latest
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Run Vale
      run: vale --minAlertLevel=suggestion README.md docs heoml specs conductor

  docs:
    name: Repo Docs Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Sync environment
      run: uv sync --all-extras --dev

    - name: Run docs checks
      run: uv run nox -s docs

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Sync environment
      run: uv sync --all-extras --dev
    - name: Verify lockfile
      run: uv lock --check
    - name: Check formatting with ruff
      run: uv run nox -s lint
    - name: Type check with basedpyright
      run: uv run nox -s typecheck
    - name: Check version metadata
      run: uv run nox -s version

  mutation-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Sync environment
      run: uv sync --all-extras --dev
    - name: Show mutation-testing configuration
      run: uv run mutmut run --help

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Sync environment
      run: uv sync --all-extras --dev

    - name: Build distribution
      run: uv run nox -s build

    - name: Test with pytest
      run: uv run nox -s tests
