name: Python CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.15.1'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m venv .venv-ci
        .venv-ci/bin/python -c 'import sys; assert sys.version_info[:3] == (3,15,1)'
        echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
        .venv-ci/bin/python -m pip install --upgrade pip
        .venv-ci/bin/python -m pip install -r requirements.txt
    - name: Check formatting with ruff
      run: ruff format --check .
    - name: Lint with ruff
      run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15.1"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m venv .venv-ci
        .venv-ci/bin/python -c 'import sys; assert sys.version_info[:3] == (3,15,1)'
        echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
        .venv-ci/bin/python -m pip install --upgrade pip
        .venv-ci/bin/python -m pip install -r requirements.txt
        .venv-ci/bin/python -m pip install pytest

    - name: Test with pytest
      run: |
        pytest
